<!doctype html>
<html lang="fr" style="color-scheme: light;">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Preview jour — Thalasso & thermal</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; color-scheme: light !important; }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <iframe id="preview" src="./index.html?preview-light=20260831-glass" title="Prévisualisation jour de la page Thalasso & thermal"></iframe>
    <script>
      const frame = document.getElementById('preview');

      function forceLightMode() {
        try {
          const doc = frame.contentDocument;
          if (!doc || !doc.documentElement) return;
          const root = doc.documentElement;
          const body = doc.body;

          root.classList.add('theme-light');
          root.classList.remove('theme-dark');
          root.setAttribute('data-theme', 'light');
          root.style.setProperty('color-scheme', 'light', 'important');

          if (body) {
            body.classList.add('theme-light');
            body.classList.remove('theme-dark');
          }

          if (!doc.getElementById('preview-force-light-style')) {
            const style = doc.createElement('style');
            style.id = 'preview-force-light-style';
            style.textContent = `
              :root,
              html.theme-light {
                color-scheme: light !important;
                --color-primary: #1e2a50 !important;
                --color-bg: #ffffff !important;
                --color-soft: #f7f8fc !important;
                --color-border: #e6e8f2 !important;
                --color-muted: #303866 !important;
                --color-ink: #1e2a50 !important;
                --color-mist: #f1f5ff !important;
                --color-warm: #f8f6ff !important;
              }
              html.theme-light body { color: #1e2a50 !important; }
              html.theme-light .site-header { background: rgba(255,255,255,.96) !important; border-bottom-color: #e6e8f2 !important; }
              html.theme-light .main-nav,
              html.theme-light .nav-toggle { background: #fff !important; color: #1e2a50 !important; }
              html.theme-light .brand-core,
              html.theme-light .main-nav a,
              html.theme-light .nav-dropdown-toggle { color: #1e2a50 !important; }
            `;
            doc.head.appendChild(style);
          }
        } catch (error) {
          console.warn('Impossible de forcer le mode jour dans la preview.', error);
        }
      }

      frame.addEventListener('load', () => {
        forceLightMode();
        try {
          const root = frame.contentDocument.documentElement;
          const observer = new MutationObserver(forceLightMode);
          observer.observe(root, { attributes: true, attributeFilter: ['class', 'data-theme', 'style'] });
        } catch (error) {
          console.warn('Impossible de surveiller le thème de la preview.', error);
        }
      });

      setInterval(forceLightMode, 500);
    </script>
  </body>
</html>
