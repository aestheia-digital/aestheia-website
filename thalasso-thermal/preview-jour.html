<!doctype html>
<html lang="fr" style="color-scheme: light;">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preview jour — Thalasso & thermal</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <iframe id="preview" src="./index.html" title="Prévisualisation jour de la page Thalasso & thermal"></iframe>
    <script>
      const frame = document.getElementById('preview');
      frame.addEventListener('load', () => {
        try {
          const doc = frame.contentDocument;
          const root = doc.documentElement;
          root.classList.add('theme-light');
          root.classList.remove('theme-dark');
          root.style.colorScheme = 'light';
          doc.body.classList.add('theme-light');
          const style = doc.createElement('style');
          style.textContent = `
            :root { color-scheme: light !important; }
            html, body { color-scheme: light !important; }
          `;
          doc.head.appendChild(style);
        } catch (e) {
          console.warn('Impossible de forcer le mode jour dans la preview.', e);
        }
      });
    </script>
  </body>
</html>
