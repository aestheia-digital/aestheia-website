<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA responsive temporaire</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #2b2d35; }
    body { display: flex; justify-content: center; align-items: flex-start; }
    iframe { height: 900px; border: 0; background: #fff; }
  </style>
</head>
<body>
  <iframe id="preview" src="/" title="Deploy Preview AesthéIA"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const width = Number(params.get("width")) || 390;
    const scheme = params.get("scheme") === "dark" ? "dark" : "light";
    document.documentElement.style.colorScheme = scheme;
    const frame = document.getElementById("preview");
    frame.style.width = width + "px";
    frame.style.colorScheme = scheme;
  </script>
</body>
</html>
